id: T-USM-0007-01
rule: R-USM-0007
title: "Nabycie roszczenia o lokatorskie prawo powoduje powstanie członkostwa"
category: POSITIVE
status: SPECIFIED
given:
  - "osoba nabyła roszczenie o ustanowienie spółdzielczego lokatorskiego prawa do lokalu mieszkalnego (T1)"
when: "przebieg zdarzenia wg R-USM-0007"
then:
  result: "Membership.status = ACTIVE"
  because: "spełniona przesłanka T1 - triggers_event MembershipArose, skutek natychmiastowy (ex lege), bez udziału żadnego organu spółdzielni"
