id: T-PS-0013-01
rule: R-PS-0013
title: "Zmiana statutu uchwalona większością 2/3, zgłoszona i wpisana do KRS"
category: POSITIVE
status: SPECIFIED
given:
  - "walne_zgromadzenie podjęło uchwałę o zmianie statutu większością 2/3 głosów (krok 1)"
  - "zarzad zgłosił uchwałę do sądu rejestrowego z dwoma odpisami protokołu (krok 2)"
  - "sąd rejestrowy wpisał zmianę do KRS (krok 3)"
when: "przebieg procedury R-PS-0013, kroki 1-3"
then:
  result: "Statut.registered_in_krs = true; zmiana wywołuje skutki prawne"
  because: "wszystkie trzy kroki zakończone zgodnie z PS-ART-012A §1-3"
