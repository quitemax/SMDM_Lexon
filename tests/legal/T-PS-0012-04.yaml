id: T-PS-0012-04
rule: R-PS-0012
title: "Próg dla założycieli-osób prawnych (3) - granica"
category: BOUNDARY
status: SPECIFIED
cases:
  - label: "n = minimum - 1 (2)"
    given: ["2 founders, wszyscy osoby prawne"]
    when: "sprawdzenie `precondition` kroku 1"
    then:
      result: false
      because: "2 < 3, próg dla osób prawnych (PS-ART-006 §2 zdanie 1)"
  - label: "n = minimum (3)"
    given: ["3 founders, wszyscy osoby prawne"]
    when: "sprawdzenie `precondition` kroku 1"
    then:
      result: true
      because: "3 >= 3"
