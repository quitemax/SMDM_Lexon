id: T-PS-0002-03
rule: R-PS-0002
title: "Próg zniżony gdy członkami są wyłącznie osoby prawne (wyjątek E2, 3)"
category: BOUNDARY
status: SPECIFIED
cases:
  - label: "n = minimum - 1 (2)"
    given: ["spółdzielnia.member_count = 2", "statut przewiduje, że członkami są wyłącznie osoby prawne (wyjątek E2)"]
    when: "sprawdzenie warunku R-PS-0002"
    then:
      result: false
      because: "2 < 3, próg zniżony §5 wyjątek E2 niespełniony"
  - label: "n = minimum (3)"
    given: ["spółdzielnia.member_count = 3", "statut przewiduje, że członkami są wyłącznie osoby prawne (wyjątek E2)"]
    when: "sprawdzenie warunku R-PS-0002"
    then:
      result: true
      because: "3 >= 3, próg zniżony §5 wyjątek E2 spełniony"
