relation: "BENEFICIARY_OF"
from: "Osoba"
to: "Członek"
description: "Osoba wskazana przez członka (w deklaracji lub odrębnym oświadczeniu na piśmie) do otrzymania wypłaty udziałów po jego śmierci. Odrębne od dziedziczenia - prawo z tego tytułu nie wchodzi do spadku."
