event: "ExclusionOverturned"
description: "Uchwała o wykluczeniu została skutecznie zaskarżona/uchylona (odwołanie do walnego zgromadzenia uwzględnione, albo sąd prawomocnie uchylił uchwałę) - wykluczenie nigdy nie stało się skuteczne."
payload:
  - name: member
    type: "-> Członek"
  - name: overturned_by
    type: "Enum(WALNE_ZGROMADZENIE, SĄD)"
  - name: decision_date
    type: Date
triggers_transition: "PENDING_EXCLUSION -> ACTIVE"
source: "PS-ART-024 §6, §8, §9, §10 (a contrario)"
formalization_status: INFERRED
note: "Ustawa nie nazywa tego zdarzenia wprost - wynika z konstrukcji Art. 24 §10, który enumeruje wyłącznie przesłanki SKUTECZNOŚCI wykluczenia; brak spełnienia żadnej z nich, przy jednoczesnym uwzględnieniu odwołania/powództwa, oznacza powrót do ACTIVE. Oznaczone INFERRED, nie DIRECT."
