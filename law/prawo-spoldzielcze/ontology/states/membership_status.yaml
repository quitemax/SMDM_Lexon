state_machine: "MembershipStatus"
attached_to: "atrybut `status` relacji MEMBER_OF (nie encji Członek - patrz ../relations/member_of.yaml)"
states:
  - name: DECLARED
    description: "Deklaracja złożona, uchwała o przyjęciu jeszcze niepodjęta."
    source: "PS-ART-016 §1, PS-ART-017 §3"
  - name: ACTIVE
    description: "Członkostwo powstało."
    source: "PS-ART-017 §1"
  - name: REJECTED
    description: "Odmowa przyjęcia - stan terminalny tej deklaracji (członkostwo nigdy nie powstało)."
    source: "PS-ART-017 §3"
  - name: WITHDRAWN
    description: "Wystąpienie za wypowiedzeniem."
    source: "PS-ART-022"
  - name: PENDING_EXCLUSION
    description: "Uchwała o wykluczeniu podjęta, ale jeszcze nieskuteczna - biegną terminy odwołania/zaskarżenia (PS-ART-024 §10)."
    source: "PS-ART-024 §2, §10"
  - name: EXCLUDED
    description: "Wykluczenie stało się skuteczne (wina umyślna lub rażące niedbalstwo, niedające się pogodzić ze statutem/dobrymi obyczajami)."
    source: "PS-ART-024 §2, §10"
  - name: PENDING_STRUCK_OFF
    description: "Uchwała o wykreśleniu podjęta, ale jeszcze nieskuteczna - biegną terminy odwołania/zaskarżenia (PS-ART-024 §10)."
    source: "PS-ART-024 §3, §10"
  - name: STRUCK_OFF
    description: "Wykreślenie stało się skuteczne (niewykonywanie obowiązków statutowych z przyczyn niezawinionych)."
    source: "PS-ART-024 §3, §10"
  - name: DECEASED
    description: "Śmierć członka będącego osobą fizyczną, lub ustanie członka będącego osobą prawną."
    source: "PS-ART-025 §1"
transitions:
  - from: null
    to: ACTIVE
    event: "CooperativeRegistered"
    note: "Tylko dla założycieli, którzy podpisali statut - patrz ontology/events/cooperative_registered.yaml i procedures/R-PS-0012-cooperative-founding.yaml. Jeden event, N równoległych przejść (po jednym na founder)."
  - from: null
    to: DECLARED
    event: "DeclarationSubmitted"
  - from: DECLARED
    to: ACTIVE
    event: "MemberAdmitted"
  - from: DECLARED
    to: REJECTED
    event: "AdmissionRejected"
  - from: ACTIVE
    to: WITHDRAWN
    event: "MemberResigned"
  - from: ACTIVE
    to: PENDING_EXCLUSION
    event: "MemberExcluded"
  - from: PENDING_EXCLUSION
    to: EXCLUDED
    event: "ExclusionBecameEffective"
  - from: PENDING_EXCLUSION
    to: ACTIVE
    event: "ExclusionOverturned"
  - from: ACTIVE
    to: PENDING_STRUCK_OFF
    event: "MemberStruckOff"
  - from: PENDING_STRUCK_OFF
    to: STRUCK_OFF
    event: "StruckOffBecameEffective"
  - from: PENDING_STRUCK_OFF
    to: ACTIVE
    event: "StruckOffOverturned"
  - from: ACTIVE
    to: DECEASED
    event: "MemberDied"
notes:
  - "Rewizja Phase 2 (Art. 1-14): domknięto poprzednią lukę 'poza zakresem: przejście null -> ACTIVE dla założycieli' - teraz jawnie zamodelowana jako `CooperativeRegistered` (patrz wyżej), skoro Dział II został sformalizowany."
  - "Rewizja Phase 2: pierwotna wersja tego automatu (Phase 1) modelowała `ACTIVE -> EXCLUDED/STRUCK_OFF` jako jedno przejście i zapowiadała dodanie stanu pośredniego dla odroczonej skuteczności (PS-ART-024 §10) - zrobione tutaj przez PENDING_EXCLUSION/PENDING_STRUCK_OFF. `MemberExcluded`/`MemberStruckOff` oznaczają teraz moment podjęcia uchwały, nie moment skuteczności - patrz procedura `../../procedures/R-PS-0016-exclusion-or-strike-off.yaml` po pełny opis warunków skuteczności i ścieżek odwołania."
  - "SCOPE_NOTE: dla spółdzielni mieszkaniowych stan EXCLUDED/STRUCK_OFF osiągany tą ścieżką jest w praktyce wyparty przez USM - patrz ../../interpretations/OBS-0001-lex-specialis-usm-membership.md. Ustanie członkostwa w takiej spółdzielni przebiega innym torem (utrata prawa do lokalu)."
formalization_status: STRUCTURAL
