id: R-PS-0032
norm_type: PROHIBITION
title: "Wyłączenie wierzytelności spółdzielni z tytułu wpłat na udziały od zajęcia na rzecz jej wierzycieli"
source:
  act: "Prawo spółdzielcze"
  article: "27"
  paragraph: "5"
  normalized_ref: "PS-ART-027"
validity:
  from: "2026-03-23"
  to: null
subject: "Spółdzielnia"
statement: >-
  Wierzytelności spółdzielni do członka z tytułu wpłat na udziały nie
  podlegają zajęciu na rzecz wierzycieli spółdzielni.
formalization_status: DIRECT
note: "Uzupełnia R-PS-0019 (brak odpowiedzialności członka wobec wierzycieli spółdzielni) z drugiej strony - tu chroniona jest wierzytelność SPÓŁDZIELNI wobec członka (o wpłatę udziałów) przed zajęciem przez wierzycieli SPÓŁDZIELNI, nie przed zajęciem przez wierzycieli członka (to R-PS-0029/0030)."
tests: ["T-PS-0032-01"]
