  division: "Dział II. Tryb zakładania i rejestrowania spółdzielni"
article: "11"
paragraphs:
  - number: "1"
    text: "Spółdzielnia nabywa osobowość prawną z chwilą wpisania jej do Krajowego Rejestru Sądowego."
  - number: "2"
    text: "Za czynności dokonane w interesie spółdzielni przed zarejestrowaniem osoby działające do chwili zarejestrowania spółdzielni odpowiadają wobec osób trzecich solidarnie. Za zobowiązania wynikające z tych czynności spółdzielnia odpowiada po jej zarejestrowaniu tak jak za zaciągnięte przez siebie. Jednakże osoby działające przed zarejestrowaniem spółdzielni odpowiadają wobec niej według przepisów prawa cywilnego."
