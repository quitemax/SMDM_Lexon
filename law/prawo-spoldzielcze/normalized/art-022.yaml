    text: "Członek spółdzielni może wystąpić z niej za wypowiedzeniem. Wypowiedzenie powinno być dokonane pod nieważnością na piśmie. Termin i okres wypowiedzenia określa statut. Za datę wystąpienia uważa się następny dzień po upływie okresu wypowiedzenia."
