id: PS-ART-021
act: "Prawo spółdzielcze"
source:
  dz_u: "Dz.U. 2026 poz. 521"
  consolidated_text_as_of: "2026-03-23"
structure:
  part: "Część I. Spółdzielnie"
  title: "Tytuł I. Przepisy wspólne"
  division: "Dział III. Członkowie, ich prawa i obowiązki"
article: "21"
paragraphs:
  - number: null
    text: "Członek spółdzielni nie może przed ustaniem członkostwa żądać zwrotu wpłat dokonanych na udziały (nie dotyczy to jednak wpłat przekraczających ilość udziałów, których zadeklarowania wymaga statut obowiązujący w chwili żądania zwrotu). Zwrot tych wpłat nie może nastąpić przed zatwierdzeniem sprawozdania finansowego za rok, w którym członek wystąpił z żądaniem oraz w wypadku, gdy jego udziały zostały przeznaczone na pokrycie strat spółdzielni (art. 19 § 2). Sposób i termin zwrotu określa statut."
layer: normalized_source_text
verbatim: true
note: "Segmentacja źródłowa, bez interpretacji semantycznej. Zawiera wyjątek w nawiasie (wpłaty przekraczające wymaganą liczbę udziałów) - patrz AGENTS.md sekcja 19."
