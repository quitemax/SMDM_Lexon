id: PS-ART-012A
act: "Prawo spółdzielcze"
source:
  dz_u: "Dz.U. 2026 poz. 521"
  consolidated_text_as_of: "2026-03-23"
structure:
  part: "Część I. Spółdzielnie"
  title: "Tytuł I. Przepisy wspólne"
  division: "Dział II. Tryb zakładania i rejestrowania spółdzielni"
article: "12a"
paragraphs:
  - number: "1"
    text: "Zmiana statutu spółdzielni wymaga uchwały walnego zgromadzenia podjętej większością 2/3 głosów."
  - number: "2"
    text: "Zarząd jest obowiązany uchwałę o zmianie statutu zgłosić w ciągu trzydziestu dni od daty jej podjęcia do sądu rejestrowego, załączając dwa odpisy protokołu walnego zgromadzenia."
  - number: "3"
    text: "Zmiana statutu nie wywołuje skutków prawnych przed jej wpisaniem do Krajowego Rejestru Sądowego."
layer: normalized_source_text
verbatim: true
note: "Segmentacja źródłowa, bez interpretacji semantycznej. §2 zawiera termin ustawowy (30 dni) analogiczny w konstrukcji do terminów z PS-ART-017/024 - kandydat do własnej reguły PROCEDURE/DEADLINE, jeśli zakres formalizacji kiedyś obejmie zmianę statutu."
