  consolidated_text_as_of: "2026-03-23"
structure:
  part: "Część I. Spółdzielnie"
  title: "Tytuł I. Przepisy wspólne"
  division: "Dział III. Członkowie, ich prawa i obowiązki"
article: "19"
paragraphs:
  - number: "1"
    text: "Członek spółdzielni obowiązany jest do wniesienia wpisowego oraz zadeklarowanych udziałów stosownie do postanowień statutu."
  - number: "2"
    text: "Członek spółdzielni uczestniczy w pokrywaniu jej strat do wysokości zadeklarowanych udziałów."
  - number: "3"
    text: "Członek spółdzielni nie odpowiada wobec wierzycieli spółdzielni za jej zobowiązania."
