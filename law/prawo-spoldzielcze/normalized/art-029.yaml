id: PS-ART-029
act: "Prawo spółdzielcze"
source:
  dz_u: "Dz.U. 2026 poz. 521"
  consolidated_text_as_of: "2026-03-23"
structure:
  part: "Część I. Spółdzielnie"
  title: "Tytuł I. Przepisy wspólne"
  division: "Dział III. Członkowie, ich prawa i obowiązki"
article: "29"
paragraphs:
  - number: "1"
    text: "Roszczenia o wypłatę udziałów, udziału w nadwyżce bilansowej oraz z tytułu zwrotu wkładów albo ich równowartości pieniężnej ulegają przedawnieniu z upływem trzech lat."
  - number: "2"
    repealed: true
    text: "(uchylony)"
  - number: "3"
    text: "Przepis § 1 nie ma zastosowania do roszczeń o zwrot nieruchomości."
layer: normalized_source_text
verbatim: true
note: "Segmentacja źródłowa, bez interpretacji semantycznej. Bezpośrednio dotyczy roszczeń już sformalizowanych w Art. 25-28 (jeszcze niesformalizowanych regułami, tylko znormalizowanych) - termin przedawnienia (3 lata) to DEADLINE kandydujący do przyszłej reguły."
