structure:
  part: "Część I. Spółdzielnie"
  title: "Tytuł I. Przepisy wspólne"
  division: "Dział III. Członkowie, ich prawa i obowiązki"
article: "16a"
paragraphs:
  - number: null
    text: "Spadkobierca zmarłego członka spółdzielni dziedziczy udziały, jeżeli jest członkiem spółdzielni lub złożył deklarację przystąpienia do spółdzielni. Jeżeli spadkobierców jest więcej niż jeden, powinni oni wskazać jednego spośród siebie, który uzyskuje prawo do udziałów, chyba że podzielą oni udziały między tych spadkobierców, którzy złożyli deklarację przystąpienia do spółdzielni. Spółdzielnia nie może odmówić przyjęcia w poczet członków spadkobierców dziedziczących udziały, jeżeli odpowiadają oni wymogom określonym w statucie."
layer: normalized_source_text
verbatim: true
note: "Segmentacja źródłowa, bez interpretacji semantycznej."
