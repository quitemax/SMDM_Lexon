id: R-USM-0001
norm_type: STRUCTURAL
title: "Odesłanie rezydualne do Prawa spółdzielczego"
source:
  act: "Ustawa o spółdzielniach mieszkaniowych"
  article: "1"
  paragraph: "7"
  normalized_ref: "USM-ART-001"
validity:
  from: "2026-06-10"
  to: null
subject: "Spółdzielnia"
statement: >-
  W zakresie nieuregulowanym w Ustawie o spółdzielniach mieszkaniowych
  stosuje się przepisy Prawa spółdzielczego, z zastrzeżeniem ust. 8 i 9
  (patrz R-USM-0002, R-USM-0003 - wyłączenia).
effect: >-
  To jest podstawa prawna dla OBS-0001 (law/prawo-spoldzielcze/interpretations/OBS-0001-lex-specialis-usm-membership.md)
  - potwierdza wprost lex_specialis: Prawo spółdzielcze stosuje się
  rezydualnie, nie równolegle/domyślnie. Reguły Prawa spółdzielczego
  nieobjęte wyłączeniami z ust. 8-9 (np. R-PS-0004 prawa członka,
  R-PS-0006 obowiązki, R-PS-0011 treść statutu) stosują się do
  spółdzielni mieszkaniowych bez zmian.
formalization_status: DIRECT
references:
  - target: R-USM-0002
    type: LIMITED_BY
  - target: R-USM-0003
    type: LIMITED_BY
tests: ["T-USM-0001-01", "T-USM-0001-02"]
